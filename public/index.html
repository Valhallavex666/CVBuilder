<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat CV Mudah - CV Builder</title>
    <!-- Memanggil Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animasi sederhana untuk tombol */
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.4);
        }
    </style>
</head>
<body class="bg-[#f4f9ff] font-sans antialiased text-gray-800 min-h-screen flex items-center relative">

    <!-- Container Utama -->
    <div class="max-w-7xl mx-auto px-6 sm:px-10 lg:px-16 py-12 w-full grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
        
        <!-- Bagian Kiri (Teks & Tombol) -->
        <div class="flex flex-col items-start text-left">
            
            <!-- Teks Kecil di Atas
            <p class="text-sm font-semibold text-gray-500 mb-4 tracking-wide">
                🔥 LEBIH DARI 10,000 CV DIBUAT HARI INI
            </p> -->
            
            <!-- Headline Utama (Sesuai Request) -->
            <h1 class="text-5xl sm:text-6xl font-extrabold text-[#1e293b] leading-tight mb-6">
                Buat CV mu dengan <br class="hidden sm:block"> cara yang <span class="text-[#0ea5e9]">mudah & gratis</span>
            </h1>
            
            <!-- Deskripsi Pendukung -->
            <p class="text-lg text-gray-600 mb-10 max-w-lg leading-relaxed">
                Silahkan dibuat aja CV nya mumpung gratis Om, ada 6 template CV ATS di sini ya</p>
            
            <!-- Tombol Aksi (Hanya 1 tombol, langsung ke login) -->
            <a href="login.html" 
               class="btn-hover inline-block bg-[#0ea5e9] text-white text-lg font-bold py-4 px-10 rounded-xl transition-all duration-300">
                Buat CV Sekarang
            </a>

        </div>

        <!-- Bagian Kanan (Ilustrasi / Ornamen) -->
        <div class="hidden md:flex justify-center relative">
            <div class="absolute w-72 h-96 bg-blue-100 rounded-2xl transform rotate-6 -z-10 mt-4"></div>
            <div class="absolute w-72 h-96 bg-blue-200 rounded-2xl transform -rotate-3 -z-10 mt-2"></div>
            <div class="w-72 h-96 bg-white border border-gray-100 rounded-2xl shadow-xl z-10 p-6 flex flex-col gap-4">
                <div class="w-full h-8 bg-gray-200 rounded animate-pulse"></div>
                <div class="w-3/4 h-4 bg-gray-200 rounded animate-pulse"></div>
                <div class="w-1/2 h-4 bg-gray-200 rounded animate-pulse"></div>
                <div class="w-full h-24 bg-blue-50 rounded mt-4"></div>
                <div class="w-full h-4 bg-gray-200 rounded"></div>
                <div class="w-full h-4 bg-gray-200 rounded"></div>
            </div>
        </div>

    </div>
    <!-- Watermark Keresahan -->
    <p class="absolute bottom-4 right-6 text-xs text-gray-400 italic tracking-wider">
    dibuat atas dasar keresahan
    </p>
    <p class="absolute bottom-4 right-6 text-xs text-gray-400 italic tracking-wider">
    -RS-
    </p>
</body>
</html>
